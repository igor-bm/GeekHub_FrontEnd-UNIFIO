<h1>Produtos em Promoção</h1>

<table border="1" style="border-collapse: collapse; width: 100%; max-width: 600px;">
  <thead>
    <tr style="background-color: #f2f2f2;">
      <th>Nome</th>
      <th>Preço</th>
      <th>Ação</th>
    </tr>
  </thead>
  <tbody>
    @for (produto of produtos; track produto.id) {
      <tr>
        <td [style.font-weight]="produto.promocao ? 'bold' : 'normal'">
          {{ produto.nome }}
          
          @if (produto.promocao) {
            <span style="color: #28a745; font-size: 0.85em;">(Produto em promoção)</span>
          }
        </td>
        
        <td [ngStyle]="{ 'color': produto.promocao ? '#dc3545' : 'black', 'font-weight': produto.promocao ? 'bold' : 'normal' }">
          R$ {{ produto.preco.toFixed(2) }}
        </td>

        <td>
          <button (click)="alternarPromocao(produto)">
            {{ produto.promocao ? 'Desativar Promoção' : 'Ativar Promoção' }}
          </button>
        </td>
      </tr>
    }
  </tbody>
</table>
