<div>
  <label>Nome do Produto: </label>
  <input type="text" [(ngModel)]="nomeProduto" />
</div>

<hr />

<h2>Produto: {{ nomeProduto }}</h2>
<p>Quantidade em estoque: <strong>{{ estoque }}</strong></p>

<div>
  <button (click)="diminuir()" [disabled]="estoque === 0">-</button>
  <button (click)="aumentar()">+</button>
</div>
