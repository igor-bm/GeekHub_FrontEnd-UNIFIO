<div>
  <label>Usuário: </label>
  <input type="text" [(ngModel)]="usuario" />
</div>

<div>
  <label>Senha: </label>
  <input type="password" [(ngModel)]="senha" />
</div>

<div>
  <button 
    (click)="fazerLogin()" 
    [disabled]="!usuario || !senha">
    Entrar
  </button>
</div>

<hr />
<p *ngIf="mensagemBoasVindas">{{ mensagemBoasVindas }}</p>
